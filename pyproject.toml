[project]
name = "meta-data-extraction"
version = "0.1.0"
description = "Modular metadata extraction framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "arxiv>=2.1",
    "pymupdf4llm",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

# CPU checks on Windows; Linux uses PyPI's CUDA-enabled PyTorch wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]

[dependency-groups]
finetune-prepare = [
    "transformers==5.21.0",
    "tokenizers==0.23.3",
    "jinja2>=3.1.6,<4",
]
finetune = [
    { include-group = "finetune-prepare" },
    "torch>=2.10,<2.11",
    "peft>=0.21.2,<0.22",
    "trl>=1.16,<1.17",
    "accelerate>=1.15,<1.16",
    "mlflow>=3.17.2,<4",
]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=9.0.3",
]
