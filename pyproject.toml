[project]
name = "meta-data-extraction"
version = "0.1.0"
description = "Modular metadata extraction framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "arxiv>=2.1",
    "pymupdf4llm",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=9.0.3",
]
