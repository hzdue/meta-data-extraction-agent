version: "1.0.0"
method: json_only
prepare_config: configs/finetune_prepare.yaml
prepared_dir: data/finetune/pseudo_label_supervision/prepared
tracking_config: configs/finetune_tracking.yaml
output_dir: outputs/finetune/pseudo_label_supervision/pseudo_length_filtered_seed42
seed: 42
max_steps: 111
save_steps: 32
validation_steps: 32
validation_max_new_tokens: 16384
learning_rate: 0.0001
lr_scheduler_type: constant
weight_decay: 0.0
max_grad_norm: 1.0
microbatch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
offload_activations: true
mlp_chunk_size: 2048
packing: false
max_seq_length: 65536
dtype: bfloat16
load_in_4bit: true
attn_implementation: sdpa
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
