  user_authorization_date: "2026-11-09"

gate_c:
  comparison: r_then_d_vs_mixed_and_d32
  sample_recovery_margin_f1: 0.02
  equivalence_margin_f1: 0.03
  late_interference_margin_f1: 0.03
  minimum_positive_seeds: 2
  minimum_net_improved_papers: 1
  maximum_largest_paper_absolute_share: 0.25
  decision_rules:
    shortlist_r_then_d: R8-to-D24 improves samples and sample references by at least 0.02 over mixed D24+R8, stays within 0.03 on its other fields and within 0.03 of D32 on all five fields, with distributed seed and paper support.
    late_interference: D24-to-R8 is at least 0.03 below R8-to-D24 on samples or sample references with distributed seed and paper support.
    otherwise: Stop order experiments; do not add ratios, optimizer resets or specialized sharing on the reused corpus.
