    name: r_then_d
    family: training_order_control
    description: One full R cycle followed by three full D cycles, with optimizer state retained.
    stages: [{task: R, examples: 8}, {task: D, examples: 24}]
    exposures: {D: 24, R: 8}
    gradient_accumulation_steps: 4
    boundary_update: 2
    endpoint_updates: 8
    checkpoint_interval: 6
    train_sampling_strategy: sequential
  d_then_r:
    name: d_then_r
    family: training_order_control
    description: Three full D cycles followed by one full R cycle, with optimizer state retained.
    stages: [{task: D, examples: 24}, {task: R, examples: 8}]
    exposures: {D: 24, R: 8}
    gradient_accumulation_steps: 4
    boundary_update: 6
    endpoint_updates: 8
    checkpoint_interval: 6
    train_sampling_strategy: sequential

prerequisites:
  ablation_config: configs/finetune_ablation.yaml
  ablation_config_sha256: 35cdf302d415395688deb3012b3d0dc13c8192f2ec95315d454ff6e167daf760
  phase_b_evaluation_config: configs/finetune_followup_b_evaluation.yaml
