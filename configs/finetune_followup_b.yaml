# Frozen before D32 training. Thresholds use F1 differences on the reused
# thirty-paper development corpus and cannot be revised after a D32 output is seen.
gate_b:
  source_analysis: outputs/finetune/followup/phase-a1/paired_error_analysis.json
  source_analysis_sha256: 9ea85bf92dfa1478b17a1e9c7a6655b3982d94ab300963b857396361efdc936d
  comparison: matched_d_dr_minus_d32
  equivalence_margin_f1: 0.03
  sample_recovery_margin_f1: 0.03
  r_specific_facilities_margin_f1: 0.04
  r_specific_facility_refs_margin_f1: 0.03
  minimum_positive_seeds: 2
  minimum_net_improved_papers: 1
  maximum_largest_paper_absolute_share: 0.25
  decision_rules:
    prefer_d32: D24+R8 is no more than 0.03 F1 above D32 on facilities and facility references, while D32 is at least 0.03 above D24+R8 on samples and sample references.
    proceed_phase_c: D24+R8 is at least 0.04 above D32 on facilities and 0.03 above on facility references, both advantages are positive in at least two seeds and more papers improve than worsen, and neither field has more than 25 percent of absolute paired change from one paper.
    otherwise: Stop schedule experiments and expand development data; do not reinterpret an inconclusive result as a pass.
