domain_name: photon_and_neutron
schemas:
  - generic.json
  - photon_and_neutron.json

parser:
  type: pdf

extractor: {}

validator: {}

llm:
  provider: openai_compatible
  model: google/gemma-4-31B-it
  base_url: http://localhost:8001/v1
  api_key_env: QWEN_API_KEY
  temperature: 0.0
  max_tokens: 12288
  max_doc_chars: 400000

tracker:
  type: local
  output_dir: data/experiment
