domain_name: photon_and_neutron
schemas:
  - generic.json
  - photon_and_neutron.json

parser:
  type: pdf

extractor:
  shot_mode: few_shot
  few_shot:
    example_ids:
      - "2309.13729"
      - "2104.10884"
      - "2304.08002"

validator: {}

llm:
  provider: openai_compatible
  model: openai/gpt-5.5-2026-04-23
  base_url: PLACEHOLDER_COLLABORATOR_ENDPOINT
  api_key_env: OPENAI_API_KEY
  reasoning_effort: none
  max_tokens: 12288
  max_tokens_param: max_completion_tokens
  temperature: 0.0
  max_doc_chars: 400000

tracker:
  type: local
  output_dir: data/experiment
