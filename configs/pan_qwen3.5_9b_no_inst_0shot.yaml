domain_name: photon_and_neutron
schemas:
  - generic_no_instructions.json
  - photon_and_neutron_no_instructions.json

parser:
  type: pdf

extractor: {}

validator: {}

llm:
  provider: openai_compatible
  model: Qwen/Qwen3.5-9B
  base_url: http://localhost:8001/v1
  api_key_env: QWEN_API_KEY
  temperature: 0.0
  max_tokens: 12288
  max_doc_chars: 400000

tracker:
  type: local
  output_dir: data/experiment
