version: '1.0'
source: 40-paper corpus gold, annotations, and PDF-validated same-institution names
scope: facility identities for evaluation alignment

# Facility identity aliases. Used by the
# `facility_alias` normalizer inside the facilities *alignment key* only
# (evaluation_metrics_v0.5). Value scoring (facilities.attrs.name) is
# untouched: an aligned acronym/full-name pair still surfaces its
# wording difference in the attribute score.
#
# Curation rule (task 9b decision, 2026-07-14): acronym <-> full name of
# the SAME institution only. Beamline/instrument <-> host facility pairs
# (e.g. SANS-1 <-> FRM II, BALDER <-> MAX IV) are deliberately NOT
# bridged: the annotation guideline treats naming level as a genuine
# ambiguity, and bridging it is a semantics decision, not normalization.
# PaNET-based technique normalization was evaluated and deferred (only
# 23/149 corpus technique strings exactly match a PaNET label; see
# docs/_alias_worksheet.md).
#
# Grounding: every entry's institution appears in the corpus
# (docs/_alias_worksheet.md §2). Expansion is applied casefolded on
# word boundaries; multi-word keys are matched as phrases.
#
# PDF validation (2026-07-14): every alias was checked against the raw
# text of all 40 corpus PDFs: acronym matched case-sensitively on word
# boundaries, full name matched casefolded. Comment scheme per entry:
#   defined in:  papers where acronym AND full name co-occur (strongest
#                evidence, i.e. the paper itself defines the acronym)
#   acro / full: papers with only one of the two forms
#   fires on:    papers whose gold/annotation facility *name strings*
#                contain the acronym (i.e. where the normalizer can
#                affect IAA/gold-side alignment today; all other entries
#                exist only for robustness to model outputs)
# Comments are documentation only, the evaluator reads just the
# key/value pairs.

